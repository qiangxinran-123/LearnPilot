[project]
name = "learnpilot"
version = "0.1.0"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = ["backend/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]
